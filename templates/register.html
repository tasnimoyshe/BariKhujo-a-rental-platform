<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - BashaKhuji</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: linear-gradient(135deg, #f0fdf4 0%, #e0f2fe 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.05), 0 0px 15px rgba(16, 185, 129, 0.1);
        }

        .input-group { margin-bottom: 1.25rem; }
        .input-group label { 
            display: block; 
            font-size: 0.85rem; 
            font-weight: 700; 
            color: #374151; 
            margin-bottom: 0.4rem; 
            letter-spacing: 0.3px;
        }
        
        /* Wrapper for perfect icon alignment */
        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            width: 100%;
        }

        .input-wrapper input { 
            width: 100%; 
            padding: 0.875rem 1rem; 
            border: 2px solid #f3f4f6; 
            border-radius: 0.875rem; 
            outline: none; 
            font-size: 0.95rem; 
            font-weight: 500;
            color: #1f2937;
            background-color: #f9fafb; 
            transition: all 0.3s ease; 
        }
        
        .input-wrapper input:focus { 
            border-color: #10B981; 
            background-color: #ffffff; 
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.1); 
        }
        
        .toggle-password { 
            position: absolute; 
            right: 1rem; 
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer; 
            color: #9ca3af; 
            transition: all 0.2s ease; 
            padding: 2px;
        }
        .toggle-password:hover { color: #10B981; }

        .btn-primary { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.4);
        }

        /* Styling errors cleanly */
        .errorlist { 
            color: #ef4444; 
            font-size: 0.75rem; 
            font-weight: 600; 
            margin-top: 0.4rem; 
            padding-left: 0; 
            list-style: none;
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }
    </style>
</head>
<body>

    <div class="max-w-[420px] w-full">
        <!-- Floating Logo -->
        <div class="text-center mb-6">
            <a href="{% url 'home' %}" class="text-3xl font-extrabold text-emerald-600 tracking-tight flex items-center justify-center gap-2">
                <svg class="w-8 h-8" fill="currentColor" viewBox="0 0 24 24"><path d="M12 3L2 12h3v8h6v-6h2v6h6v-8h3L12 3z"/></svg>
                BashaKhuji
            </a>
        </div>

        <div class="glass-card rounded-[2rem] p-8 sm:p-10">
            <div class="mb-8 text-center">
                <h1 class="text-2xl font-extrabold text-gray-900 mb-1">Create Account ✨</h1>
                <p class="text-gray-500 font-medium text-sm">Join to rent or post properties</p>
            </div>

            <form method="POST" id="registerForm">
                {% csrf_token %}
                
                {% for field in form %}
                <div class="input-group">
                    {{ field.label_tag }}
                    
                    <div class="input-wrapper">
                        {{ field }}
                        
                        <!-- Apply eye icon perfectly centered if it's a password field -->
                        {% if 'password' in field.name|lower %}
                            <svg class="w-5 h-5 toggle-password" fill="none" stroke="currentColor" viewBox="0 0 24 24" onclick="togglePasswordVisibility('{{ field.auto_id }}', this)">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"></path>
                            </svg>
                        {% endif %}
                    </div>

                    <!-- Displaying errors professionally -->
                    {% for error in field.errors %}
                        <p class="errorlist">
                            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg> 
                            {{ error }}
                        </p>
                    {% endfor %}
                </div>
                {% endfor %}

                <button type="submit" class="btn-primary w-full mt-4 bg-emerald-600 text-white font-bold py-3.5 rounded-xl text-base shadow-lg shadow-emerald-200/50">
                    Sign Up
                </button>
            </form>
        </div>

        <p class="text-center text-sm text-gray-500 font-semibold mt-8">
            Already have an account? 
            <a href="{% url 'login' %}" class="text-emerald-600 font-extrabold hover:underline">Sign in</a>
        </p>
    </div>

    <!-- JavaScript to toggle password visibility -->
    <script>
        function togglePasswordVisibility(inputId, iconElement) {
            const passwordInput = document.getElementById(inputId);
            
            if (passwordInput.type === "password") {
                passwordInput.type = "text";
                iconElement.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>';
            } else {
                passwordInput.type = "password";
                iconElement.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"></path>';
            }
        }
    </script>
</body>
</html>
