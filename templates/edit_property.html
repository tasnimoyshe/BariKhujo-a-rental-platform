<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Property - BashaKhuji</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #F9FAFB; }
        
        /* Custom CSS to style Django Default Form properly */
        input[type="text"], input[type="number"], select, textarea {
            width: 100%; padding: 0.875rem; border: 1px solid #e5e7eb; border-radius: 0.75rem; 
            outline: none; margin-top: 0.5rem; font-size: 0.875rem; background-color: #f9fafb;
            transition: all 0.2s;
        }
        input:focus, select:focus, textarea:focus { 
            border-color: #10B981; background-color: #ffffff; box-shadow: 0 0 0 4px #d1fae5; 
        }
        input[type="checkbox"] { width: 1.25rem; height: 1.25rem; margin-top: 0.5rem; accent-color: #10B981; }
        input[type="file"] { margin-top: 0.5rem; font-size: 0.875rem; }
        
        label { font-weight: 700; font-size: 0.875rem; color: #374151; display: flex; align-items: center; gap: 0.5rem; }
        .helptext { font-size: 0.75rem; color: #9ca3af; display: block; margin-top: 0.25rem; font-weight: 500; }
        p { margin-bottom: 1.5rem; }
    </style>
</head>
<body class="flex flex-col min-h-screen">
    
    <!-- Top Navigation -->
    <nav class="bg-white shadow-sm border-b border-gray-200 sticky top-0 z-50">
        <div class="max-w-[1200px] mx-auto px-4 sm:px-6 h-16 flex justify-between items-center">
            <a href="{% url 'home' %}" class="text-2xl font-bold text-emerald-600">BashaKhuji</a>
            <div class="flex items-center space-x-4">
                <a href="{% url 'dashboard' %}" class="font-semibold text-sm text-gray-600 hover:text-emerald-600 transition">Dashboard</a>
            </div>
        </div>
    </nav>

    <!-- Edit Form Content -->
    <div class="max-w-2xl mx-auto px-4 py-10 w-full">
        <div class="mb-8">
            <a href="{% url 'dashboard' %}" class="text-emerald-600 font-semibold text-sm flex items-center hover:underline w-max mb-4">&larr; Back to Dashboard</a>
            <h1 class="text-3xl font-extrabold text-gray-900 mb-2">Edit Property</h1>
            <p class="text-gray-500 font-medium">Update the details for "{{ property.title }}"</p>
        </div>

        <div class="bg-white p-6 md:p-8 rounded-3xl shadow-sm border border-gray-100">
            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                
                <!-- Django Form with Custom Styles -->
                {{ form.as_p }}
                
                <div class="flex flex-col sm:flex-row gap-4 pt-6 border-t border-gray-100 mt-6">
                    <button type="submit" class="flex-1 py-3.5 bg-emerald-600 text-white font-bold rounded-xl hover:bg-emerald-700 transition shadow-lg shadow-emerald-200">
                        Save Changes
                    </button>
                    <a href="{% url 'dashboard' %}" class="flex-1 py-3.5 bg-gray-100 text-gray-700 font-bold rounded-xl hover:bg-gray-200 transition text-center border border-gray-200">
                        Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
