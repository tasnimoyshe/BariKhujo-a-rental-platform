<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Reset Complete - BariKhujo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f0fdf4; }</style>
</head>
<body class="antialiased min-h-screen flex flex-col items-center justify-center p-4 relative">

    <div class="flex items-center gap-2.5 mb-10">
        <div class="bg-[#0f9d58] text-white p-2 rounded-xl shadow-lg">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
        </div>
        <span class="text-4xl font-extrabold tracking-tight text-gray-900">Bari<span class="text-[#0f9d58]">Khujo</span></span>
    </div>

    <div class="bg-white w-full max-w-md rounded-[2rem] shadow-xl border border-emerald-50 p-8 sm:p-10 text-center relative overflow-hidden z-10">
        <div class="absolute -top-10 -right-10 w-32 h-32 bg-emerald-50 rounded-full blur-2xl opacity-50"></div>
        
        <div class="relative z-10">
            <div class="w-16 h-16 bg-emerald-50 rounded-full flex items-center justify-center mx-auto mb-6 shadow-inner">
                <svg class="w-8 h-8 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
            </div>
            <h2 class="text-2xl font-extrabold text-gray-900 mb-3">Password Updated!</h2>
            <p class="text-sm text-gray-500 mb-8 font-medium leading-relaxed">Your password has been successfully reset. You can now use your new password to log in to your account.</p>
            <a href="{% url 'login' %}" class="w-full inline-block bg-[#0f9d58] text-white font-extrabold text-[1.05rem] py-3.5 rounded-xl hover:bg-emerald-700 hover:-translate-y-0.5 transition-all shadow-lg shadow-emerald-200">
                Log In Now
            </a>
        </div>
    </div>
</body>
</html>
