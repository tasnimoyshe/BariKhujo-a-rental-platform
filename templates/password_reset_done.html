<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - BariKhujo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f0fdf4; }
        .input-field {
            width: 100%; background-color: #f8fafc; border: 1px solid #e2e8f0;
            padding: 0.875rem 1rem; border-radius: 0.75rem; font-size: 0.95rem;
            color: #1e293b; outline: none; transition: all 0.2s;
        }
        .input-field:focus {
            background-color: #ffffff; border-color: #0f9d58; box-shadow: 0 0 0 4px rgba(15, 157, 88, 0.1);
        }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col items-center justify-center p-4 relative">

    <!-- Static Logo -->
    <div class="flex items-center gap-2.5 mb-10">
        <div class="bg-[#0f9d58] text-white p-2 rounded-xl shadow-lg">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
        </div>
        <span class="text-4xl font-extrabold tracking-tight text-gray-900">Bari<span class="text-[#0f9d58]">Khujo</span></span>
    </div>

    <!-- Card -->
    <div class="bg-white w-full max-w-md rounded-[2rem] shadow-xl border border-emerald-50 p-8 sm:p-10 relative overflow-hidden z-10">
        <div class="absolute -top-10 -right-10 w-32 h-32 bg-emerald-50 rounded-full blur-2xl opacity-50"></div>
        
        <div class="relative z-10">
            <div class="mb-10 text-center">
                <h1 class="text-3xl font-extrabold text-gray-900 mb-2">Forgot Password?</h1>
                <p class="text-sm font-medium text-gray-500">Enter your email address and we'll send you a link to reset your password.</p>
            </div>

            <form method="POST" class="space-y-6">
                {% csrf_token %}
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-widest mb-2">Email Address</label>
                    <input type="email" name="email" required class="input-field" placeholder="you@example.com">
                </div>
                <button type="submit" class="w-full bg-[#0f9d58] text-white font-extrabold text-[1.05rem] py-3.5 rounded-xl hover:bg-emerald-700 hover:-translate-y-0.5 transition-all shadow-lg shadow-emerald-200">
                    Send Reset Link
                </button>
            </form>
            
            <div class="text-center mt-8 pt-6 border-t border-gray-100">
                <a href="{% url 'login' %}" class="text-sm font-bold text-gray-500 hover:text-[#0f9d58] transition">← Back to Login</a>
            </div>
        </div>
    </div>
</body>
</html>
